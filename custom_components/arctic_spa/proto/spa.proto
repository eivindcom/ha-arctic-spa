syntax = "proto2";

message spa_live {
    optional int32 temperature_fahrenheit = 1;
    optional int32 temperature_setpoint_fahrenheit = 2;
    optional PUMP_STATUS pump_1 = 3;
    optional PUMP_STATUS pump_2 = 4;
    optional PUMP_STATUS pump_3 = 5;
    optional PUMP_STATUS pump_4 = 6;
    optional PUMP_STATUS pump_5 = 7;
    optional PUMP_STATUS blower_1 = 8;
    optional PUMP_STATUS blower_2 = 9;
    optional bool lights = 10;
    optional bool stereo = 11;
    optional HEATER_STATUS heater_1 = 12;
    optional HEATER_STATUS heater_2 = 13;
    optional FILTER_STATUS filter = 14;
    optional bool onzen = 15;
    optional OZONE_STATUS ozone = 16;
    optional bool exhaust_fan = 17;
    optional SAUNA_STATUS sauna = 18;
    optional int32 heater_adc = 20;
    optional int32 sauna_time_remaining = 21;
    optional bool economy = 22;
    optional int32 current_adc = 23;
    optional bool all_on = 24;
    optional bool fogger = 25;
}

message spa_command {
    optional int32 set_temperature_setpoint_fahrenheit = 1;
    optional SET_PUMP_STATUS set_pump_1 = 2;
    optional SET_PUMP_STATUS set_pump_2 = 3;
    optional SET_PUMP_STATUS set_pump_3 = 4;
    optional SET_PUMP_STATUS set_pump_4 = 5;
    optional SET_PUMP_STATUS set_pump_5 = 6;
    optional SET_PUMP_STATUS set_blower_1 = 7;
    optional SET_PUMP_STATUS set_blower_2 = 8;
    optional bool set_lights = 9;
    optional bool set_stereo = 10;
    optional bool set_filter = 11;
    optional bool set_onzen = 12;
    optional bool set_ozone = 13;
    optional bool set_exhaust_fan = 14;
    optional SET_SAUNA_STATE set_sauna_state = 15;
    optional int32 set_sauna_time_left = 16;
    optional bool all_on = 17;
    optional bool set_fogger = 18;
    optional bool spaboy_boost = 19;
    optional int32 set_orp_level_low = 50;
    optional int32 set_orp_level_high = 51;
}

message spa_information {
    optional string pack_serial_number = 1;
    optional string pack_firmware_version = 2;
    optional string pack_hardware_version = 3;
    optional string pack_product_id = 4;
    optional string pack_board_id = 5;
    optional string topside_product_id = 6;
    optional string topside_software_version = 7;
    optional string guid = 8;
    optional SPA_TYPE spa_type = 9;
    optional bool website_registration = 10;
    optional bool website_registration_confirm = 11;
    optional bytes mac_address = 12;
    optional uint32 firmware_version = 13;
    optional uint32 product_code = 14;
}

message spa_configuration {
    optional bool pump_1 = 1;
    optional bool pump_2 = 2;
    optional bool pump_3 = 3;
    optional bool pump_4 = 4;
    optional bool pump_5 = 5;
    optional bool blower_1 = 6;
    optional bool blower_2 = 7;
    optional bool lights = 8;
    optional bool stereo = 9;
    optional bool heater_1 = 10;
    optional bool heater_2 = 11;
    optional bool filter = 12;
    optional bool onzen = 13;
    optional bool ozone_peak_1 = 14;
    optional bool ozone_peak_2 = 15;
    optional bool exhaust_fan = 16;
    optional PHASE powerlines = 17;
    optional int32 breaker_size = 18;
    optional int32 smart_onzen = 19;
    optional bool fogger = 20;
}

enum PUMP_STATUS {
    OFF = 0;
    LOW = 1;
    HIGH = 2;
}

enum HEATER_STATUS {
    HEATER_IDLE = 0;
    WARMUP = 1;
    HEATING = 2;
    COOLDOWN = 3;
}

enum FILTER_STATUS {
    FILTER_IDLE = 0;
    FILTER_PURGE = 1;
    FILTER_FILTERING = 2;
    FILTER_SUSPENDED = 3;
    FILTER_OVERTEMPERATURE = 4;
    FILTER_RESUMING = 5;
    FILTER_BOOST = 6;
    FILTER_SANITIZE = 7;
}

enum OZONE_STATUS {
    OZONE_IDLE = 0;
    OZONE_ACTIVE = 1;
    OZONE_SUSPENDED = 2;
}

enum SAUNA_STATUS {
    SAUNA_STATUS_IDLE = 0;
    SAUNA_STATUS_NORMAL = 1;
    SAUNA_STATUS_PRESET_A = 2;
    SAUNA_STATUS_PRESET_B = 3;
    SAUNA_STATUS_PRESET_C = 4;
}

enum SET_PUMP_STATUS {
    SET_OFF = 0;
    SET_LOW = 1;
    SET_HIGH = 2;
}

enum SET_SAUNA_STATE {
    SAUNA_IDLE = 0;
    TIMER = 1;
    PRESET_A = 2;
    PRESET_B = 3;
    PRESET_C = 4;
}

enum SPA_TYPE {
    HOT_TUB = 0;
    COLD_TUB = 1;
    SAUNA = 2;
}

enum PHASE {
    TRUE_THREE = 0;
    SINGLE = 1;
    TWO = 2;
    THREE = 3;
}
