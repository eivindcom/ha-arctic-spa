###############################################################################
# Arctic Spa Dashboard
#
# Oppsett:
# 1. Kopier www/arctic-spa-bg.svg til Home Assistant: /config/www/arctic-spa-bg.svg
# 2. I HA: Settings → Dashboards → Add Dashboard → velg "fra scratch"
# 3. Klikk ⋮ → Edit Dashboard → ⋮ → Raw Configuration Editor
# 4. Lim inn innholdet under (views-seksjonen)
#
# Entity ID-er kan variere - sjekk i Developer Tools → States.
# Søk etter "arctic_spa" for å se dine faktiske entity ID-er.
###############################################################################

views:
  - title: Boblebad
    path: spa
    icon: mdi:hot-tub
    type: panel
    cards:
      - type: vertical-stack
        cards:

          ###################################################################
          # Hovedkort: Spa-visualisering med temperatur og effekt
          ###################################################################
          - type: picture-elements
            image: /local/arctic-spa-bg.svg
            elements:

              # --- Tittel ---
              - type: state-label
                entity: climate.boblebad
                style:
                  top: 6%
                  left: 50%
                  color: white
                  font-size: 13px
                  font-weight: 300
                  letter-spacing: 2px
                  text-transform: uppercase
                  opacity: "0.7"
                prefix: "Arctic Spa"

              # --- Vanntemperatur (stor) ---
              - type: state-label
                entity: sensor.boblebad_water_temperature
                style:
                  top: 35%
                  left: 50%
                  color: white
                  font-size: 52px
                  font-weight: 200
                  text-shadow: 0 2px 20px rgba(0,150,255,0.5)
                suffix: ""

              # --- Settpunkt ---
              - type: state-label
                entity: sensor.boblebad_setpoint_temperature
                style:
                  top: 50%
                  left: 50%
                  color: "#81d4fa"
                  font-size: 16px
                  font-weight: 400
                  opacity: "0.9"
                prefix: "Settpunkt: "

              # --- Effekt (kW) ---
              - type: state-label
                entity: sensor.boblebad_power
                style:
                  top: 12%
                  left: 88%
                  color: "#ffcc02"
                  font-size: 20px
                  font-weight: 500
                  text-shadow: 0 1px 8px rgba(255,200,0,0.3)
                suffix: ""
              - type: icon
                icon: mdi:lightning-bolt
                style:
                  top: 12%
                  left: 82%
                  color: "#ffcc02"
                  "--mdi-icon-size": 20px
                  opacity: "0.8"

              # --- Varmer 1 status ---
              - type: state-label
                entity: sensor.boblebad_heater_1
                style:
                  top: 12%
                  left: 15%
                  color: white
                  font-size: 11px
                  font-weight: 400
                  opacity: "0.8"
                prefix: "Varmer 1: "

              # --- Varmer 2 status ---
              - type: state-label
                entity: sensor.boblebad_heater_2
                style:
                  top: 18%
                  left: 15%
                  color: white
                  font-size: 11px
                  font-weight: 400
                  opacity: "0.8"
                prefix: "Varmer 2: "

              # --- Lys-knapp ---
              - type: state-icon
                entity: light.boblebad_light
                tap_action:
                  action: toggle
                style:
                  top: 75%
                  left: 15%
                  "--paper-item-icon-color": white
                  "--paper-item-icon-active-color": "#ffd54f"
                  transform: scale(1.3)
                  filter: drop-shadow(0 0 6px rgba(255,213,79,0.4))

              # --- Eco mode ---
              - type: state-icon
                entity: switch.boblebad_eco_mode
                tap_action:
                  action: toggle
                style:
                  top: 75%
                  left: 85%
                  "--paper-item-icon-color": white
                  "--paper-item-icon-active-color": "#66bb6a"
                  transform: scale(1.3)
                  filter: drop-shadow(0 0 6px rgba(102,187,106,0.4))

              # --- Pumpe-ikoner (bunn) ---
              - type: state-icon
                entity: fan.boblebad_pump_1
                tap_action:
                  action: toggle
                style:
                  top: 90%
                  left: 25%
                  "--paper-item-icon-color": "rgba(255,255,255,0.5)"
                  "--paper-item-icon-active-color": "#4fc3f7"
                  transform: scale(1.0)
              - type: state-label
                entity: fan.boblebad_pump_1
                style:
                  top: 97%
                  left: 25%
                  color: "rgba(255,255,255,0.5)"
                  font-size: 9px
                prefix: "P1"

              - type: state-icon
                entity: fan.boblebad_pump_2
                tap_action:
                  action: toggle
                style:
                  top: 90%
                  left: 37.5%
                  "--paper-item-icon-color": "rgba(255,255,255,0.5)"
                  "--paper-item-icon-active-color": "#4fc3f7"
                  transform: scale(1.0)
              - type: state-label
                entity: fan.boblebad_pump_2
                style:
                  top: 97%
                  left: 37.5%
                  color: "rgba(255,255,255,0.5)"
                  font-size: 9px
                prefix: "P2"

              - type: state-icon
                entity: fan.boblebad_pump_3
                tap_action:
                  action: toggle
                style:
                  top: 90%
                  left: 50%
                  "--paper-item-icon-color": "rgba(255,255,255,0.5)"
                  "--paper-item-icon-active-color": "#4fc3f7"
                  transform: scale(1.0)
              - type: state-label
                entity: fan.boblebad_pump_3
                style:
                  top: 97%
                  left: 50%
                  color: "rgba(255,255,255,0.5)"
                  font-size: 9px
                prefix: "P3"

              - type: state-icon
                entity: fan.boblebad_pump_4
                tap_action:
                  action: toggle
                style:
                  top: 90%
                  left: 62.5%
                  "--paper-item-icon-color": "rgba(255,255,255,0.5)"
                  "--paper-item-icon-active-color": "#4fc3f7"
                  transform: scale(1.0)
              - type: state-label
                entity: fan.boblebad_pump_4
                style:
                  top: 97%
                  left: 62.5%
                  color: "rgba(255,255,255,0.5)"
                  font-size: 9px
                prefix: "P4"

              - type: state-icon
                entity: fan.boblebad_pump_5
                tap_action:
                  action: toggle
                style:
                  top: 90%
                  left: 75%
                  "--paper-item-icon-color": "rgba(255,255,255,0.5)"
                  "--paper-item-icon-active-color": "#4fc3f7"
                  transform: scale(1.0)
              - type: state-label
                entity: fan.boblebad_pump_5
                style:
                  top: 97%
                  left: 75%
                  color: "rgba(255,255,255,0.5)"
                  font-size: 9px
                prefix: "P5"

          ###################################################################
          # Kontroller: Brytere
          ###################################################################
          - type: horizontal-stack
            cards:
              - type: button
                entity: light.boblebad_light
                name: Lys
                icon: mdi:lightbulb
                tap_action:
                  action: toggle
                show_state: true
              - type: button
                entity: switch.boblebad_stereo
                name: Stereo
                icon: mdi:speaker
                tap_action:
                  action: toggle
                show_state: true
              - type: button
                entity: switch.boblebad_onzen
                name: Onzen
                icon: mdi:water-opacity
                tap_action:
                  action: toggle
                show_state: true
              - type: button
                entity: switch.boblebad_ozone
                name: Ozon
                icon: mdi:molecule
                tap_action:
                  action: toggle
                show_state: true

          - type: horizontal-stack
            cards:
              - type: button
                entity: switch.boblebad_filter
                name: Filter
                icon: mdi:air-filter
                tap_action:
                  action: toggle
                show_state: true
              - type: button
                entity: switch.boblebad_exhaust_fan
                name: Vifte
                icon: mdi:fan
                tap_action:
                  action: toggle
                show_state: true
              - type: button
                entity: switch.boblebad_eco_mode
                name: Eco
                icon: mdi:leaf
                tap_action:
                  action: toggle
                show_state: true
              - type: thermostat
                entity: climate.boblebad
                features:
                  - type: target-temperature

          ###################################################################
          # Sensorer
          ###################################################################
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.boblebad_water_temperature
                name: Vann
                min: 20
                max: 42
                needle: true
                severity:
                  green: 36
                  yellow: 30
                  red: 20
              - type: gauge
                entity: sensor.boblebad_power
                name: Effekt
                min: 0
                max: 8
                needle: true
                severity:
                  green: 0
                  yellow: 4
                  red: 6

          - type: entities
            title: Status
            show_header_toggle: false
            entities:
              - entity: sensor.boblebad_heater_1
                name: Varmer 1
              - entity: sensor.boblebad_heater_2
                name: Varmer 2
              - entity: sensor.boblebad_filter_status
                name: Filter
              - entity: sensor.boblebad_ozone_status
                name: Ozon
              - entity: sensor.boblebad_ph
                name: pH
              - entity: sensor.boblebad_orp
                name: ORP
              - entity: sensor.boblebad_power_phase
                name: Strømfase
              - entity: sensor.boblebad_breaker_size
                name: Sikring
